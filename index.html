<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora AI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>🚀 Zora AI Studio</h2>
                <p>Your Free AI Workspace</p>
            </div>
            <nav>
                <button class="nav-btn active">💬 AI Chat</button>
                <button class="nav-btn" onclick="alert('Coming soon in next phase!')">🖼️ Image Studio</button>
                <button class="nav-btn" onclick="alert('Coming soon in next phase!')">🎥 Video Studio</button>
                <button class="nav-btn" onclick="alert('Coming soon in next phase!')">🛡️ Cybersecurity</button>
            </nav>
            <div class="ad-section">
                <button class="glow-btn">▶ Watch Ad (Get +3 Credits)</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="greeting">Hello, Creator! 👋</div>
                <div class="token-display">💎 <span id="creditCount">5</span> Credits</div>
            </header>

            <div class="chat-container" id="chatBox">
                <div class="message ai">Welcome to Zora AI! Ask me anything.</div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <!-- Embedded JavaScript to make Send Button & AI work instantly -->
    <script>
        const BACKEND_URL = "https://quiet-cake-3740.anantmi444shra.workers.dev";

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            const typingMsg = document.createElement('div');
            typingMsg.className = 'message ai';
            typingMsg.innerText = "Zora is typing...";
            document.getElementById('chatBox').appendChild(typingMsg);

            try {
                const res = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                
                const data = await res.json();
                typingMsg.remove();

                if (res.ok) {
                    appendMessage('ai', data.reply);
                } else {
                    appendMessage('ai", "❌ " + (data.error || "Server error"));
                }
            } catch (error) {
                typingMsg.remove();
                appendMessage('ai', "❌ Error connecting to server.");
            }
        }

        // Button click event
        document.getElementById('sendBtn').addEventListener('click', handleSendMessage);

        // Enter key press event
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
    </html>
