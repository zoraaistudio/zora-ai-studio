<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030b17; color: #ffffff; height: 100vh; display: flex; }
        .app-container { display: flex; width: 100%; height: 100%; }
        .sidebar { width: 260px; background: #071529; border-right: 1px solid #1a365d; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .logo-area h2 { color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); font-size: 1.5rem; margin-bottom: 5px; }
        .logo-area p { color: #8892b0; font-size: 0.8rem; }
        .nav-btn { background: transparent; color: #a8b2d1; border: 1px solid transparent; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 5px; }
        .nav-btn:hover, .nav-btn.active { background: #112240; color: #00f3ff; border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.2); }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; background: radial-gradient(circle at top left, #0a1930, #030b17); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a365d; }
        .greeting { font-size: 1.5rem; font-weight: bold; }
        .token-display { background: #0b1e36; padding: 8px 15px; border-radius: 20px; border: 1px solid #00f3ff; color: #00f3ff; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 15px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .message.user { background: #0052d4; align-self: flex-end; border-bottom-right-radius: 0; }
        .message.ai { background: #112240; align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid #1a365d; }
        .input-area { display: flex; gap: 10px; background: #0b1e36; padding: 10px; border-radius: 15px; border: 1px solid #1a365d; margin-top: 10px; }
        .input-area input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 1rem; }
        .input-area button { background: #00f3ff; color: #030b17; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        @media (max-width: 768px) { .app-container { flex-direction: column; } .sidebar { display: none; } }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="top-bar">
                <div class="greeting">Hello, Creator! 👋</div>
                <div class="token-display">💎 5 Credits</div>
            </header>
            <div class="chat-container" id="chatBox">
                <div class="message ai">Welcome to Zora AI! Ask me anything.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>

    <script>
        // Yahan "YOUR_API_KEY_HERE" ko hatakar apni AQ. wali key paste karein. 
        // Dhyan rahe .trim() ko delete NAHI karna hai!
        const API_KEY = "AQ.Ab8RN6IMAHPFiIdprnebKetw1M2qEs1sFWNg-cXQonEWGWumVQ".trim(); 

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            const typingMsg = document.createElement('div');
            typingMsg.className = 'message ai';
            typingMsg.innerText = "Zora is typing...";
            document.getElementById('chatBox').appendChild(typingMsg);

            try {
                // Maine yahan model ka exact naam 'gemini-1.5-flash-latest' kar diya hai
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': API_KEY
                    },
                    body: JSON.stringify({ contents: [{ parts: [{ text: message }] }] })
                });
                
                const data = await response.json();
                typingMsg.remove();

                if (data.error) {
                    appendMessage('ai', "❌ Google Error: " + data.error.message);
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    appendMessage('ai', data.candidates[0].content.parts[0].text);
                } else {
                    appendMessage('ai', "❌ No response from API.");
                }
            } catch (error) {
                typingMsg.remove();
                appendMessage('ai', "❌ Network error.");
            }
        }

        document.getElementById('sendBtn').addEventListener('click', handleSendMessage);
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
