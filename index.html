<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zora AI Studio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="start-screen">

    <h1>🚀 Zora AI Studio</h1>

    <p>Welcome to the future of AI.</p>

    <div class="option">
      <label for="language">🌐 Language</label>

      <select id="language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="hinglish">Hinglish</option>
      </select>
    </div>

    <div class="option">
      <label for="fontStyle">🔤 Text Style</label>

      <select id="fontStyle">
        <option value="inter">Inter</option>
        <option value="poppins">Poppins</option>
        <option value="roboto">Roboto</option>
        <option value="open-sans">Open Sans</option>
        <option value="montserrat">Montserrat</option>
        <option value="oswald">Oswald</option>
        <option value="raleway">Raleway</option>
        <option value="nunito">Nunito</option>
        <option value="ubuntu">Ubuntu</option>
        <option value="lato">Lato</option>
        <option value="merriweather">Merriweather</option>
        <option value="playfair">Playfair Display</option>
        <option value="roboto-mono">Roboto Mono</option>
        <option value="jetbrains">JetBrains Mono</option>
        <option value="space-mono">Space Mono</option>
        <option value="orbitron">Orbitron</option>
        <option value="audiowide">Audiowide</option>
        <option value="comfortaa">Comfortaa</option>
        <option value="quicksand">Quicksand</option>
        <option value="outfit">Outfit</option>
        <option value="manrope">Manrope</option>
        <option value="dm-sans">DM Sans</option>
        <option value="jakarta">Plus Jakarta Sans</option>
        <option value="fira-sans">Fira Sans</option>
        <option value="source-code">Source Code Pro</option>
      </select>
    </div>

    <button id="startBtn" onclick="startApp()">
      Start
    </button>

  </div>
alert("Zora JavaScript is working!");
  <script src="script.js"></script>

</body>
</html>
