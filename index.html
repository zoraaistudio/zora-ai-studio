<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora AI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <h2>🚀 Zora AI Studio</h2>
                <p>Your Free AI Workspace</p>
            </div>
            <nav>
                <button class="nav-btn active">💬 AI Chat</button>
                <button class="nav-btn">🖼️ Image Studio</button>
                <button class="nav-btn">🎥 Video Studio</button>
                <button class="nav-btn">🛡️ Cybersecurity</button>
            </nav>
            <div class="ad-section">
                <button id="watchAdBtn" class="glow-btn">▶ Watch Ad (Get +3 Credits)</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="greeting">Hello, Creator! 👋</div>
                <div class="token-display">💎 <span id="creditCount">5</span> Credits</div>
            </header>

            <div class="chat-container" id="chatBox">
                <div class="message ai">Welcome to Zora AI! Ask me anything.</div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off">
                <button id="sendBtn">➤</button>
            </div>
        </main>
    </div>
</body>
  </html>
