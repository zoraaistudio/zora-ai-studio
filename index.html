
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Zora AI Studio - Your AI assistant">
  <title>Zora AI Studio</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151e36;
      --border: #303b5b;
      --accent: #9b88ff;
      --muted: #c5cbea;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #f5f5ff;
      font-family: system-ui, Arial, sans-serif;
    }

    header {
      padding: 18px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header h1 {
      margin: 0;
      color: var(--accent);
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      width: min(100% - 24px, 800px);
      margin: 20px auto;
    }

    .chat-panel {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
    }

    .chat-heading {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .chat-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    #status {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #messages {
      min-height: 340px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.55;
      font-size: 15px;
    }

    .assistant {
      align-self: flex-start;
      background: #222e49;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #5142a6;
      border-bottom-right-radius: 4px;
    }

    .composer-area {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    #chatForm {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #prompt {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      padding: 13px;
      color: white;
      background: var(--bg);
      border: 1px solid #485475;
      border-radius: 12px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      background: #8875ff;
      color: white;
      padding: 14px 18px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .toolbar small {
      color: var(--muted);
      font-size: 12px;
    }

    .clear-button {
      background: transparent;
      border: 1px solid var(--border);
      padding: 8px 11px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      #messages { min-height: 300px; max-height: 55vh; }
      .message { max-width: 96%; }
      #chatForm { gap: 7px; }
      #sendButton { padding: 14px 12px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Zora AI Studio</h1>
    <p>Your AI assistant</p>
  </header>

  <main>
    <section class="chat-panel" aria-label="AI Chat">
      <div class="chat-heading">
        <h2>Chat with Zora</h2>
        <p id="status" role="status">Ready to chat</p>
      </div>

      <div id="messages" aria-live="polite">
        <div class="message assistant">
          Hello! Welcome to Zora AI Studio. How can I help you today?
        </div>
      </div>

      <div class="composer-area">
        <form id="chatForm">
          <textarea
            id="prompt"
            placeholder="Message Zora..."
            aria-label="Your message"
            rows="1"
            maxlength="10000"
            required
          ></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>

        <div class="toolbar">
          <small>Enter to send · Shift+Enter for a new line</small>
          <button class="clear-button" id="clearButton" type="button">
            New chat
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Zora AI Studio · AI responses may occasionally be inaccurate.
  </footer>

  <script>
    "use strict";

    /*
      LIVE BACKEND CONFIGURATION

      Replace this URL with your deployed backend URL.
      Example format:
      https://your-worker.your-account.workers.dev

      Do not put your Gemini API key in this file.
    */
    const BACKEND_URL = "PASTE_YOUR_BACKEND_URL_HERE";

    const form = document.getElementById("chatForm");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const messagesElement = document.getElementById("messages");
    const statusElement = document.getElementById("status");

    let busy = false;
    let history = [];

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function addMessage(text, role) {
      const element = document.createElement("div");
      element.className = "message " + role;
      element.textContent = text;
      messagesElement.appendChild(element);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return element;
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      promptInput.disabled = value;
      clearButton.disabled = value;
      sendButton.textContent = value ? "..." : "Send";
    }

    function resetChat() {
      if (busy) return;

      history = [];
      messagesElement.replaceChildren();

      addMessage(
        "New chat started! How can I help you?",
        "assistant"
      );

      setStatus("Ready to chat");
      promptInput.focus();
    }

    clearButton.addEventListener("click", resetChat);

    promptInput.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();

        if (form.requestSubmit) {
          form.requestSubmit();
        }
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;

      const message = promptInput.value.trim();
      if (!message) return;

      if (
        !BACKEND_URL ||
        BACKEND_URL === "PASTE_YOUR_BACKEND_URL_HERE" ||
        !/^https:\/\/[^/]+/i.test(BACKEND_URL)
      ) {
        setStatus("Backend URL set up nahi hai. BACKEND_URL configure karo.");
        return;
      }

      setBusy(true);
      setStatus("Zora is thinking...");

      addMessage(message, "user");
      promptInput.value = "";

      const replyElement = addMessage("Thinking...", "assistant");

      const nextHistory = [
        ...history,
        { role: "user", content: message }
      ];

      try {
        const response = await fetch(
          BACKEND_URL.replace(/\/+$/, "") + "/chat",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message,
              history: history
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error || `Server error (${response.status})`
          );
        }

        if (
          typeof data.reply !== "string" ||
          !data.reply.trim()
        ) {
          throw new Error(
            "Backend response mein reply nahi mila."
          );
        }

        replyElement.textContent = data.reply;

        history = [
          ...nextHistory,
          { role: "assistant", content: data.reply }
        ];

        setStatus("Reply received");
      } catch (error) {
        replyElement.textContent =
          "Sorry, reply nahi mil saka. " + error.message;

        setStatus(
          "Connection error. Backend URL, deployment aur server logs check karo."
        );
      } finally {
        setBusy(false);
        promptInput.focus();
        messagesElement.scrollTop = messagesElement.scrollHeight;
      }
    });
  </script>
</body>
  </html>
