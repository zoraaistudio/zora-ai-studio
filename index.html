
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zora AI Studio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f4f6ff;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #141c33;
      border-bottom: 1px solid #293453;
    }

    header h1 {
      margin: 0;
      color: #9c8cff;
    }

    header p {
      margin-bottom: 0;
      color: #bac4df;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .settings, .chatbox {
      background: #141c33;
      border: 1px solid #293453;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      color: #cbd5f1;
    }

    input, select, button, textarea {
      font: inherit;
      border-radius: 9px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0b1020;
      color: white;
      border: 1px solid #394768;
    }

    button {
      padding: 12px 16px;
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #8875ff;
      color: white;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .settings button {
      width: 100%;
      margin-top: 12px;
    }

    #status {
      font-size: 14px;
      color: #bac4df;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    #messages {
      height: 390px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      max-width: 90%;
      background: #5142a6;
    }

    .ai {
      align-self: flex-start;
      max-width: 100%;
      width: 100%;
      background: #202b45;
    }

    .composer {
      display: flex;
      gap: 8px;
    }

    .composer input {
      min-width: 0;
      flex: 1;
    }

    .note {
      font-size: 12px;
      color: #bac4df;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      #messages { height: 55vh; }
      .composer { flex-direction: column; }
      .composer button { width: 100%; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Zora AI Studio</h1>
    <p>Your AI assistant</p>
  </header>

  <main>
    <section class="settings">
      <h2>API Settings</h2>

      <label for="apiKey">Gemini API key</label>
      <input
        id="apiKey"
        type="password"
        placeholder="Paste your API key"
        autocomplete="off"
      >

      <label for="model">Available model</label>
      <select id="model">
        <option value="">Load models first</option>
      </select>

      <button id="loadModels" type="button">
        Load available models
      </button>

      <p id="status" role="status">Enter your API key to begin.</p>

      <p class="note">
        For private testing only. Do not publish or share your key.
        A public website should use a secure backend instead.
      </p>
    </section>

    <section class="chatbox">
      <h2>Chat with Zora</h2>

      <div id="messages" aria-live="polite">
        <div class="message ai">
          Hello! Load an available model and send me a message.
        </div>
      </div>

      <form id="chatForm" class="composer">
        <input
          id="prompt"
          type="text"
          placeholder="Type your message..."
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    "use strict";

    const API_BASE =
      "AQ.Ab8RN6JP5waO5Cx-jshKNd25moARsJPdN_efJb6a8sMgx1c2yA";

    const keyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("model");
    const loadButton = document.getElementById("loadModels");
    const statusBox = document.getElementById("status");
    const messages = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("sendButton");

    let chatHistory = [];
    let busy = false;

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function addMessage(text, who) {
      const item = document.createElement("div");
      item.className = "message " + who;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    async function readResponse(response) {
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        const message =
          data.error?.message || `HTTP ${response.status}`;
        throw new Error(message);
      }

      return data;
    }

    loadButton.addEventListener("click", async () => {
      const key = keyInput.value.trim();

      if (!key) {
        setStatus("Please enter your API key.");
        keyInput.focus();
        return;
      }

      loadButton.disabled = true;
      modelSelect.innerHTML = "";
      setStatus("Loading models...");

      try {
        const response = await fetch(
          `${API_BASE}/models?pageSize=1000`,
          {
            method: "GET",
            headers: { "x-goog-api-key": key }
          }
        );

        const data = await readResponse(response);

        const available = (data.models || []).filter(model =>
          (model.supportedGenerationMethods || [])
            .includes("generateContent")
        );

        if (available.length === 0) {
          throw new Error(
            "No models supporting generateContent were returned."
          );
        }

        available.sort((a, b) =>
          a.name.localeCompare(b.name)
        );

        for (const model of available) {
          const option = document.createElement("option");
          option.value = model.name;
          option.textContent =
            `${model.displayName || model.name} (${model.name})`;
          modelSelect.appendChild(option);
        }

        const preferred = available.find(model =>
          /flash/i.test(model.name)
        );

        if (preferred) {
          modelSelect.value = preferred.name;
        }

        setStatus(
          `${available.length} available model(s) loaded.`
        );
      } catch (error) {
        setStatus("Could not load models: " + error.message);
      } finally {
        loadButton.disabled = false;
      }
    });

    chatForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (busy) return;

      const key = keyInput.value.trim();
      const model = modelSelect.value;
      const prompt = promptInput.value.trim();

      if (!key) {
        setStatus("Enter your API key first.");
        return;
      }

      if (!model) {
        setStatus("Load models and select a model first.");
        return;
      }

      if (!prompt) return;

      busy = true;
      sendButton.disabled = true;
      promptInput.disabled = true;

      addMessage(prompt, "user");
      promptInput.value = "";

      const replyBox = addMessage("Thinking...", "ai");

      const nextHistory = [
        ...chatHistory,
        {
          role: "user",
          parts: [{ text: prompt }]
        }
      ];

      try {
        const response = await fetch(
          `${API_BASE}/${model}:generateContent`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": key
            },
            body: JSON.stringify({
              contents: nextHistory
            })
          }
        );

        const data = await readResponse(response);

        const answer = (data.candidates?.[0]?.content?.parts || [])
          .map(part => part.text || "")
          .filter(Boolean)
          .join("\n");

        if (!answer) {
          throw new Error(
            "No text returned. The response may have been blocked."
          );
        }

        replyBox.textContent = answer;

        chatHistory = [
          ...nextHistory,
          {
            role: "model",
            parts: [{ text: answer }]
          }
        ];

        setStatus("Response received.");
      } catch (error) {
        replyBox.textContent = "Error: " + error.message;
        setStatus("Request failed. Check the key, model and API quota.");
      } finally {
        busy = false;
        sendButton.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
          </html>
