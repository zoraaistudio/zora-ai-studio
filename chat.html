<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zora AI Studio</title>

<style>

/* ===============================
   RESET
================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

/* ===============================
   BODY
================================ */

body{

  min-height:100vh;
  width:100%;

  background:

    radial-gradient(
      circle at 20% 20%,
      rgba(0,140,255,.25) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 80% 30%,
      rgba(0,170,255,.35) 0 1.5px,
      transparent 2px
    ),

    radial-gradient(
      circle at 40% 70%,
      rgba(0,120,255,.3) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 90% 80%,
      rgba(0,200,255,.3) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 10% 90%,
      rgba(80,150,255,.25) 0 1.5px,
      transparent 2px
    ),

    radial-gradient(
      circle at center,
      #073b91 0%,
      #031b4f 35%,
      #01091f 65%,
      #00030d 100%
    );

  background-size:
    180px 180px,
    250px 250px,
    220px 220px,
    300px 300px,
    200px 200px,
    100% 100%;

  background-attachment:fixed;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

/* ===============================
   STAR FIELD
================================ */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background-image:

    radial-gradient(
      circle,
      rgba(210,245,255,.95) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(50,180,255,.85) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(0,120,255,.7) 0 1.5px,
      transparent 2.5px
    ),

    radial-gradient(
      circle,
      rgba(120,210,255,.8) 0 2px,
      transparent 3px
    );

  background-size:
    83px 97px,
    137px 151px,
    211px 223px,
    307px 319px;

  animation:
    starsMove 22s linear infinite;

  opacity:.75;

  z-index:0;
}

@keyframes starsMove{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-100px);
  }

}

/* ===============================
   COSMIC GLOW
================================ */

body::after{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background:

    radial-gradient(
      circle at 20% 30%,
      rgba(0,100,255,.16),
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(0,180,255,.12),
      transparent 35%
    ),

    radial-gradient(
      circle at 50% 50%,
      rgba(30,80,255,.08),
      transparent 50%
    );

  z-index:0;
}

/* ===============================
   MAIN CONTAINER
================================ */

.container{

  position:relative;

  z-index:1;

  width:95%;

  max-width:450px;

  height:90vh;

  background:rgba(0,10,30,.55);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:
    1px solid rgba(0,170,255,.25);

  border-radius:20px;

  display:flex;

  flex-direction:column;

  overflow:hidden;

  box-shadow:

    0 0 12px rgba(0,160,255,.35),

    0 0 35px rgba(0,100,255,.25),

    0 0 70px rgba(0,80,255,.12),

    inset 0 0 30px rgba(0,150,255,.08);
}

/* ===============================
   HEADER
================================ */

.header{

  background:
    linear-gradient(
      90deg,
      rgba(0,45,120,.72),
      rgba(0,130,220,.72),
      rgba(0,45,120,.72)
    );

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  color:white;

  padding:18px;

  font-size:22px;

  font-weight:bold;

  display:flex;

  justify-content:center;

  align-items:center;

  position:relative;

  border-bottom:
    1px solid rgba(80,200,255,.5);

  box-shadow:

    0 0 12px rgba(0,150,255,.7),

    0 0 30px rgba(0,100,255,.35);

  text-shadow:
    0 0 8px rgba(150,230,255,.9);
}

/* ===============================
   HEADER BUTTONS
================================ */

.header-actions{

  position:absolute;

  right:10px;

  display:flex;

  gap:6px;
}

.header-actions button{

  color:white;

  border-radius:12px;

  padding:8px 10px;

  cursor:pointer;

  font-size:18px;
}

#clearBtn{

  background:rgba(0,80,180,.55);

  border:
    1px solid rgba(0,190,255,.5);

  box-shadow:
    0 0 8px rgba(0,150,255,.35);

  transition:.2s ease;
}

#clearBtn:hover{

  background:rgba(0,110,220,.75);

  box-shadow:
    0 0 14px rgba(0,190,255,.7);
}

#newBtn{

  background:rgba(0,120,220,.55);

  border:
    1px solid rgba(80,210,255,.55);

  box-shadow:
    0 0 8px rgba(0,150,255,.35);

  transition:.2s ease;
}

#newBtn:hover{

  background:rgba(0,160,240,.75);

  box-shadow:
    0 0 14px rgba(0,200,255,.7);
}

/* ===============================
   CHAT AREA
================================ */

#chat{

  flex:1;

  padding:15px;

  overflow-y:auto;

  color:white;

  background:rgba(0,5,25,.12);

  backdrop-filter:blur(2px);

  -webkit-backdrop-filter:blur(2px);

  scroll-behavior:smooth;
}

/* ===============================
   USER MESSAGE
================================ */

.you{

  background:rgba(0,110,255,.25);

  border:
    1px solid rgba(50,180,255,.55);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:right;

  word-wrap:break-word;

  box-shadow:

    0 0 8px rgba(0,140,255,.3),

    0 0 18px rgba(0,100,255,.12);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);

  animation:
    messageAppear .35s ease-out;
}

/* ===============================
   BOT MESSAGE
================================ */

.bot{

  background:rgba(0,70,180,.22);

  border:
    1px solid rgba(0,200,255,.4);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:left;

  word-wrap:break-word;

  box-shadow:

    0 0 8px rgba(0,150,255,.3),

    0 0 20px rgba(0,120,255,.12);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);

  animation:
    messageAppear .35s ease-out;
}

/* ===============================
   MESSAGE ANIMATION
================================ */

@keyframes messageAppear{

  from{

    opacity:0;

    transform:translateY(8px);
  }

  to{

    opacity:1;

    transform:translateY(0);
  }
}

/* ===============================
   COPY BUTTON
================================ */

.copy-btn{

  margin-top:8px;

  padding:5px 10px;

  border:none;

  border-radius:8px;

  background:#3498db;

  color:white;

  cursor:pointer;

  font-size:13px;
}

.copy-btn:hover{

  opacity:.85;
}

/* ===============================
   REGENERATE BUTTON
================================ */

.regenerate-btn{

  margin-top:8px;

  margin-left:5px;

  padding:5px 10px;

  border:none;

  border-radius:8px;

  background:#8e44ad;

  color:white;

  cursor:pointer;

  font-size:13px;
}

.regenerate-btn:hover{

  opacity:.85;
}

/* ===============================
   BOTTOM
================================ */

.bottom{

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:rgba(0,10,35,.65);

  border-top:
    1px solid rgba(0,160,255,.3);

  box-shadow:
    0 -5px 20px rgba(0,100,255,.12);

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);
}

/* ===============================
   INPUT
================================ */

#msg{

  flex:1;

  padding:12px;

  border:
    1px solid rgba(0,170,255,.4);

  border-radius:25px;

  outline:none;

  font-size:16px;

  color:white;

  background:rgba(0,40,100,.45);

  box-shadow:
    inset 0 0 10px rgba(0,120,255,.12);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);
}

#msg::placeholder{

  color:
    rgba(200,230,255,.65);
}

#msg:focus{

  border-color:
    rgba(0,200,255,.8);

  box-shadow:

    0 0 8px rgba(0,170,255,.45),

    0 0 18px rgba(0,100,255,.2),

    inset 0 0 10px rgba(0,120,255,.12);

  background:
    rgba(0,50,120,.5);
}

/* ===============================
   BOTTOM BUTTONS
================================ */

.bottom button{

  padding:12px 16px;

  border:
    1px solid rgba(80,200,255,.4);

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #006eff,
      #00bfff
    );

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(0,140,255,.45);

  transition:.2s ease;
}

.bottom button:hover{

  box-shadow:
    0 0 18px rgba(0,180,255,.7);

  transform:translateY(-1px);
}

.bottom button:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;
}

/* ===============================
   VOICE BUTTON
================================ */

#voiceBtn{

  min-width:55px;

  background:
    rgba(0,100,200,.35);

  border:
    1px solid rgba(0,190,255,.5);

  box-shadow:
    0 0 10px rgba(0,150,255,.45);
}

#voiceBtn:hover{

  transform:scale(1.08);

  box-shadow:
    0 0 16px rgba(0,200,255,.8);
}

/* ===============================
   SEND BUTTON
================================ */

#sendBtn{

  min-width:65px;

  background:
    linear-gradient(
      135deg,
      #006eff,
      #00c8ff
    );
}

/* ===============================
   SCROLLBAR
================================ */

#chat::-webkit-scrollbar{

  width:4px;
}

#chat::-webkit-scrollbar-track{

  background:
    rgba(0,10,35,.15);

  border-radius:10px;
}

#chat::-webkit-scrollbar-thumb{

  background:
    linear-gradient(
      180deg,
      rgba(0,200,255,.8),
      rgba(0,80,255,.65)
    );

  border-radius:10px;

  box-shadow:
    0 0 8px rgba(0,160,255,.5);
}

/* ===============================
   MOBILE
================================ */

@media(max-width:400px){

  body{

    min-height:100dvh;

    align-items:stretch;
  }

  .container{

    width:100%;

    max-width:none;

    height:100dvh;

    border-radius:0;

    border-left:none;

    border-right:none;
  }

  .header{

    font-size:18px;

    padding:15px;
  }

  #msg{

    font-size:14px;
  }

  .bottom{

    padding:8px;
  }

  .bottom button{

    padding:10px 12px;
  }

  #chat{

    padding:12px;
  }
}

</style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <span>🤖 Zora AI Studio</span>

    <div class="header-actions">

      <button
        id="newBtn"
        onclick="newChat()">
        ➕
      </button>

      <button
        id="clearBtn"
        onclick="clearChat()">
        🗑
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div id="chat"></div>


  <!-- BOTTOM -->

  <div class="bottom">

    <input
      type="text"
      id="msg"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button
      id="voiceBtn"
      onclick="startVoice()">
      🎤
    </button>

    <button
      id="sendBtn"
      onclick="send()">
      Send
    </button>

  </div>

</div>


<script>

/* =================================================
   ZORA AI STUDIO
   OPENROUTER CONFIGURATION
================================================= */

const API_URL =
  "https://openrouter.ai/api/v1/chat/completions";


/* =================================================
   API KEY
================================================= */

let API_KEY =
  localStorage.getItem("zoraApiKey") || "";


/* =================================================
   DATE
================================================= */

let now = new Date();

let currentDate =
  now.toLocaleDateString("en-IN",{

    weekday:"long",

    year:"numeric",

    month:"long",

    day:"numeric"

  });


/* =================================================
   MEMORY
================================================= */

let savedMemory =
  localStorage.getItem("zoraMemory");

let memoryText =
  savedMemory
    ? savedMemory
    : "No saved user memory yet.";


/* =================================================
   SYSTEM MESSAGE
================================================= */

function createSystemMessage(){

  const selectedLanguage =
    localStorage.getItem("zoraLanguage") || "en";

  let languageInstruction = "";

  if(selectedLanguage === "hi"){

    languageInstruction =
      "Always reply in Hindi (हिन्दी).";

  }

  else if(selectedLanguage === "hinglish"){

    languageInstruction =
      "Always reply in natural Hinglish using simple Roman Hindi mixed with English.";

  }

  else{

    languageInstruction =
      "Always reply in English.";

  }

  return {

    role:"system",

    content:

`You are Zora AI Studio, a helpful, friendly and intelligent AI assistant.

Current date:
${currentDate}

${languageInstruction}

Always answer directly and clearly.

User memory:
${memoryText}`

  };

}


/* =================================================
   MESSAGES
================================================= */

let messages = [
  createSystemMessage()
];


/* =================================================
   LOAD SAVED CHAT
================================================= */

const chat =
  document.getElementById("chat");

let savedChat =
  localStorage.getItem("zoraChat");

if(savedChat){

  chat.innerHTML =
    savedChat;

}


/* =================================================
   LOAD SAVED MESSAGES
================================================= */

let savedMessages =
  localStorage.getItem("zoraMessages");

if(savedMessages){

  try{

    const parsed =
      JSON.parse(savedMessages);

    if(Array.isArray(parsed) && parsed.length){

      messages = parsed;

    }

  }catch(error){

    console.log(
      "Saved messages could not be loaded."
    );

  }

}


/* =================================================
   ENTER KEY
================================================= */

document
  .getElementById("msg")
  .addEventListener(
    "keypress",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        send();

      }

    }
  );


/* =================================================
   API KEY SETUP
================================================= */

function setupApiKey(){

  if(API_KEY){

    return true;

  }

  const key =
    prompt(
      "Enter your OpenRouter API key:"
    );

  if(!key){

    return false;

  }

  API_KEY =
    key.trim();

  localStorage.setItem(
    "zoraApiKey",
    API_KEY
  );

  return true;

}


/* =================================================
   SEND MESSAGE
================================================= */

async function send(){

  const input =
    document.getElementById("msg");

  const sendBtn =
    document.getElementById("sendBtn");

  const text =
    input.value.trim();


  if(text === ""){

    return;

  }


  /* API KEY */

  if(!setupApiKey()){

    return;

  }


  const time =
    new Date().toLocaleTimeString(
      "en-IN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  /* USER MESSAGE */

  messages.push({

    role:"user",

    content:text

  });


  /* SAVE NAME */

  if(
    text
      .toLowerCase()
      .includes("my name is")
  ){

    const parts =
      text.split(/my name is/i);

    if(parts.length > 1){

      const name =
        parts[1].trim();

      memoryText =
        "User name is " + name;

      localStorage.setItem(
        "zoraMemory",
        memoryText
      );

    }

  }


  /* SHOW USER MESSAGE */

  chat.innerHTML += `

    <div class="you">

      <b>You:</b><br>

      ${escapeHTML(text)}

      <br>

      <small>${time}</small>

    </div>

  `;


  chat.scrollTop =
    chat.scrollHeight;


  /* CLEAR INPUT */

  input.value = "";


  /* DISABLE */

  sendBtn.disabled = true;

  sendBtn.innerText = "...";


  /* TYPING */

  const typingDiv =
    document.createElement("div");

  typingDiv.className =
    "bot";

  typingDiv.innerHTML =
    "<b>Zora:</b><br>⌛ Zora is typing...";

  chat.appendChild(
    typingDiv
  );

  chat.scrollTop =
    chat.scrollHeight;


  try{

    /* =========================================
       API REQUEST
    ========================================= */

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer " + API_KEY,

            "Content-Type":
              "application/json",

            "HTTP-Referer":
              "https://zoraai-studio.github.io",

            "X-Title":
              "Zora AI Studio"

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:
                messages,

              stream:true

            })

        }
      );


    /* =========================================
       ERROR CHECK
    ========================================= */

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "OpenRouter Error " +
        response.status +
        ": " +
        errorText
      );

    }


    if(!response.body){

      throw new Error(
        "Streaming response body is empty."
      );

    }


    /* REMOVE TYPING */

    typingDiv.remove();


    /* BOT */

    const botDiv =
      document.createElement("div");

    botDiv.className =
      "bot";

    botDiv.innerHTML = `

      <b>Zora:</b><br>

      <span class="reply-text"></span>

      <br>

      <small>${time}</small>

    `;

    chat.appendChild(
      botDiv
    );


    const replyText =
      botDiv.querySelector(
        ".reply-text"
      );


    /* =========================================
       STREAM
    ========================================= */

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let buffer = "";

    let fullReply = "";


    while(true){

      const result =
        await reader.read();

      if(result.done){

        break;

      }


      buffer +=
        decoder.decode(
          result.value,
          {
            stream:true
          }
        );


      const lines =
        buffer.split("\n");


      buffer =
        lines.pop();


      for(
        let line of lines
      ){

        line =
          line.trim();


        if(
          !line.startsWith("data:")
        ){

          continue;

        }


        const data =
          line
            .substring(5)
            .trim();


        if(
          data === "[DONE]"
        ){

          continue;

        }


        try{

          const json =
            JSON.parse(data);


          const token =
            json
              ?.choices
              ?.[0]
              ?.delta
              ?.content;


          if(token){

            fullReply +=
              token;


            replyText.innerHTML =
              escapeHTML(
                fullReply
              )
              .replace(
                /\n/g,
                "<br>"
              );


            chat.scrollTop =
              chat.scrollHeight;

          }

        }catch(error){

          console.log(
            "Stream chunk skipped:",
            data
          );

        }

      }

    }


    /* =========================================
       FINISH RESPONSE
    ========================================= */

    if(
      fullReply.trim() !== ""
    ){

      messages.push({

        role:"assistant",

        content:fullReply

      });


      botDiv.innerHTML = `

        <b>Zora:</b><br>

        <span class="reply-text">

          ${escapeHTML(fullReply)
            .replace(/\n/g,"<br>")}

        </span>

        <br>

        <small>${time}</small>

        <br>

        <button
          class="copy-btn"
          onclick="copyZoraReply(this)">
          📋 Copy
        </button>

        <button
          class="regenerate-btn"
          onclick="regenerateLastReply(this)">
          🔄 Regenerate
        </button>

      `;

    }

    else{

      botDiv.innerHTML =
        "<b>Zora:</b><br>⚠️ No response received.";

    }


  }catch(error){

    /* REMOVE TYPING */

    if(
      typingDiv &&
      typingDiv.parentElement
    ){

      typingDiv.remove();

    }


    /* ERROR */

    const errorDiv =
      document.createElement("div");

    errorDiv.className =
      "bot";

    errorDiv.innerHTML = `

      <b>Zora:</b><br>

      ❌ ${escapeHTML(
        error.message
      )}

    `;

    chat.appendChild(
      errorDiv
    );


    console.error(
      "Zora Error:",
      error
    );

  }


  /* SAVE CHAT */

  localStorage.setItem(
    "zoraChat",
    chat.innerHTML
  );


  localStorage.setItem(
    "zoraMessages",
    JSON.stringify(messages)
  );


  /* ENABLE */

  sendBtn.disabled =
    false;

  sendBtn.innerText =
    "Send";


  chat.scrollTop =
    chat.scrollHeight;

}


/* =================================================
   HTML ESCAPE
================================================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =================================================
   COPY
================================================= */

function copyZoraReply(button){

  const botDiv =
    button.parentElement;

  const replyText =
    botDiv.querySelector(
      ".reply-text"
    );


  if(!replyText){

    return;

  }


  const text =
    replyText.innerText.trim();


  if(!text){

    return;

  }


  function success(){

    button.innerText =
      "✅ Copied!";

    setTimeout(
      function(){

        button.innerText =
          "📋 Copy";

      },
      1500
    );

  }


  function failure(){

    button.innerText =
      "❌ Copy failed";

    setTimeout(
      function(){

        button.innerText =
          "📋 Copy";

      },
      1500
    );

  }


  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    navigator.clipboard
      .writeText(text)
      .then(success)
      .catch(
        function(){

          fallbackCopy(
            text,
            success,
            failure
          );

        }
      );

  }

  else{

    fallbackCopy(
      text,
      success,
      failure
    );

  }

}


/* =================================================
   FALLBACK COPY
================================================= */

function fallbackCopy(
  text,
  success,
  failure
){

  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value =
    text;

  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  document.body.appendChild(
    textarea
  );

  textarea.focus();

  textarea.select();


  try{

    const result =
      document.execCommand(
        "copy"
      );

    document.body.removeChild(
      textarea
    );


    if(result){

      success();

    }

    else{

      failure();

    }

  }catch(error){

    document.body.removeChild(
      textarea
    );

    failure();

  }

}


/* =================================================
   REGENERATE
================================================= */

async function regenerateLastReply(button){

  if(!messages.length){

    return;

  }


  let lastUserIndex = -1;


  for(
    let i = messages.length - 1;
    i >= 0;
    i--
  ){

    if(
      messages[i].role === "user"
    ){

      lastUserIndex =
        i;

      break;

    }

  }


  if(lastUserIndex === -1){

    return;

  }


  const lastUserMessage =
    messages[lastUserIndex].content;


  button.innerText =
    "⌛ Generating...";


  button.disabled =
    true;


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + API_KEY

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:[

                createSystemMessage(),

                {

                  role:"user",

                  content:
                    lastUserMessage

                }

              ]

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        "OpenRouter Error " +
        response.status
      );

    }


    const newReply =
      data
        ?.choices
        ?.[0]
        ?.message
        ?.content;


    if(!newReply){

      throw new Error(
        "Empty response"
      );

    }


    const botDiv =
      button.parentElement;


    const replyText =
      botDiv.querySelector(
        ".reply-text"
      );


    if(replyText){

      replyText.innerHTML =
        escapeHTML(
          newReply
        )
        .replace(
          /\n/g,
          "<br>"
        );

    }


    messages.push({

      role:"assistant",

      content:newReply

    });


    localStorage.setItem(
      "zoraMessages",
      JSON.stringify(messages)
    );


    localStorage.setItem(
      "zoraChat",
      chat.innerHTML
    );


    button.innerText =
      "🔄 Regenerate";


  }catch(error){

    console.error(error);


    button.innerText =
      "❌ Failed";


    setTimeout(
      function(){

        button.innerText =
          "🔄 Regenerate";

      },
      1500
    );

  }


  button.disabled =
    false;

}


/* =================================================
   VOICE
================================================= */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event){

      document
        .getElementById("msg")
        .value =
          event
            .results[0][0]
            .transcript;

    };


  recognition.onerror =
    function(event){

      alert(
        "Voice Error: " +
        event.error
      );

    };


  recognition.start();

}

function newChat(){

  if(
    !confirm(
      "Start a new chat?"
    )
  ){

    return;

  }


  document
    .getElementById("chat")
    .innerHTML = "";


  localStorage.removeItem(
    "zoraChat"
  );

  localStorage.removeItem(
    "zoraMessages"
  );


  messages = [

    createSystemMessage()

  ];

}
