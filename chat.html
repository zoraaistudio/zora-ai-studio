<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zora AI Studio</title>

<style>

/* ================================
   RESET
================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}


/* ================================
   BODY
================================ */

body{

  min-height:100vh;
  width:100%;

  background:
    radial-gradient(
      circle at 50% 50%,
      #073b91 0%,
      #031b4f 35%,
      #01091f 65%,
      #00030d 100%
    );

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}


/* ================================
   STAR FIELD
================================ */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background-image:

    radial-gradient(
      circle,
      rgba(210,245,255,.95) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(50,180,255,.85) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(0,120,255,.7) 0 1.5px,
      transparent 2.5px
    );

  background-size:
    83px 97px,
    137px 151px,
    211px 223px;

  animation:starsMove 25s linear infinite;

  opacity:.7;

  z-index:0;
}


@keyframes starsMove{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-100px);
  }

}


/* ================================
   COSMIC GLOW
================================ */

body::after{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background:

    radial-gradient(
      circle at 20% 30%,
      rgba(0,100,255,.16),
      transparent 35%
    ),

    radial-gradient(
      circle at 80% 70%,
      rgba(0,180,255,.12),
      transparent 35%
    );

  z-index:0;
}


/* ================================
   MAIN CONTAINER
================================ */

.container{

  position:relative;

  z-index:1;

  width:95%;

  max-width:450px;

  height:90vh;

  background:rgba(0,10,30,.55);

  backdrop-filter:blur(12px);

  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(0,170,255,.3);

  border-radius:20px;

  display:flex;

  flex-direction:column;

  overflow:hidden;

  box-shadow:

    0 0 12px rgba(0,160,255,.35),

    0 0 35px rgba(0,100,255,.25),

    0 0 70px rgba(0,80,255,.12);

}


/* ================================
   HEADER
================================ */

.header{

  min-height:65px;

  background:

    linear-gradient(
      90deg,
      rgba(0,45,120,.85),
      rgba(0,130,220,.85),
      rgba(0,45,120,.85)
    );

  color:white;

  padding:12px 10px;

  font-size:21px;

  font-weight:bold;

  display:flex;

  justify-content:center;

  align-items:center;

  position:relative;

  border-bottom:1px solid rgba(80,200,255,.5);

  box-shadow:

    0 0 12px rgba(0,150,255,.7),

    0 0 30px rgba(0,100,255,.35);

  text-shadow:
    0 0 8px rgba(150,230,255,.9);
}


/* HEADER BUTTONS */

.header-actions{

  position:absolute;

  right:8px;

  display:flex;

  gap:6px;
}


.header-actions button{

  width:42px;

  height:40px;

  border-radius:12px;

  color:white;

  font-size:18px;

  cursor:pointer;

  background:rgba(0,80,180,.55);

  border:1px solid rgba(0,190,255,.5);

  box-shadow:
    0 0 8px rgba(0,150,255,.35);
}


.header-actions button:active{

  transform:scale(.95);
}


/* ================================
   CHAT
================================ */

#chat{

  flex:1;

  padding:15px;

  overflow-y:auto;

  color:white;

  background:rgba(0,5,25,.12);

  scroll-behavior:smooth;
}


/* USER MESSAGE */

.you{

  background:rgba(0,110,255,.25);

  border:1px solid rgba(50,180,255,.55);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:right;

  word-wrap:break-word;

  box-shadow:

    0 0 8px rgba(0,140,255,.3),

    0 0 18px rgba(0,100,255,.12);
}


/* BOT MESSAGE */

.bot{

  background:rgba(0,70,180,.22);

  border:1px solid rgba(0,200,255,.4);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:left;

  word-wrap:break-word;

  box-shadow:

    0 0 8px rgba(0,150,255,.3),

    0 0 20px rgba(0,120,255,.12);
}


/* MESSAGE ANIMATION */

.you,
.bot{

  animation:messageAppear .3s ease-out;
}


@keyframes messageAppear{

  from{

    opacity:0;

    transform:translateY(8px);
  }

  to{

    opacity:1;

    transform:translateY(0);
  }

}


/* ================================
   BUTTONS INSIDE CHAT
================================ */

.copy-btn,
.regenerate-btn{

  margin-top:8px;

  padding:6px 10px;

  border:none;

  border-radius:8px;

  color:white;

  cursor:pointer;

  font-size:13px;
}


.copy-btn{

  background:#3498db;
}


.regenerate-btn{

  margin-left:5px;

  background:#8e44ad;
}


.copy-btn:active,
.regenerate-btn:active{

  transform:scale(.96);
}


/* ================================
   BOTTOM AREA
================================ */

.bottom{

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:rgba(0,10,35,.75);

  border-top:1px solid rgba(0,160,255,.3);

  box-shadow:
    0 -5px 20px rgba(0,100,255,.12);

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);
}


/* ================================
   INPUT
================================ */

#msg{

  flex:1;

  min-width:0;

  padding:12px 15px;

  border:1px solid rgba(0,170,255,.4);

  border-radius:25px;

  outline:none;

  font-size:16px;

  color:white;

  background:rgba(0,40,100,.45);

  box-shadow:
    inset 0 0 10px rgba(0,120,255,.12);
}


#msg::placeholder{

  color:rgba(200,230,255,.65);
}


#msg:focus{

  border-color:rgba(0,200,255,.8);

  box-shadow:

    0 0 8px rgba(0,170,255,.45),

    0 0 18px rgba(0,100,255,.2),

    inset 0 0 10px rgba(0,120,255,.12);
}


/* ================================
   BOTTOM BUTTONS
================================ */

.bottom button{

  padding:12px 15px;

  border:1px solid rgba(80,200,255,.4);

  border-radius:25px;

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  background:

    linear-gradient(
      135deg,
      #006eff,
      #00bfff
    );

  box-shadow:
    0 0 10px rgba(0,140,255,.45);
}


#voiceBtn{

  width:52px;

  height:48px;

  padding:0;

  background:rgba(0,100,200,.35);
}


#sendBtn{

  min-width:70px;
}


.bottom button:active{

  transform:scale(.96);
}


#sendBtn:disabled{

  opacity:.55;

  cursor:not-allowed;
}


/* ================================
   SCROLLBAR
================================ */

#chat::-webkit-scrollbar{

  width:4px;
}


#chat::-webkit-scrollbar-track{

  background:rgba(0,10,35,.15);
}


#chat::-webkit-scrollbar-thumb{

  background:

    linear-gradient(
      180deg,
      rgba(0,200,255,.8),
      rgba(0,80,255,.65)
    );

  border-radius:10px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

  body{

    min-height:100dvh;

    align-items:stretch;
  }


  .container{

    width:100%;

    max-width:none;

    height:100dvh;

    border-radius:0;

    border-left:none;

    border-right:none;
  }


  .header{

    font-size:18px;

    min-height:62px;
  }


  #chat{

    padding:12px;
  }


  #msg{

    font-size:14px;

    padding:11px 13px;
  }


  .bottom{

    padding:8px;
  }


  #voiceBtn{

    width:48px;

    height:46px;
  }


  #sendBtn{

    min-width:68px;

    padding:11px 12px;
  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <span>🤖 Zora AI Studio</span>

    <div class="header-actions">

      <button
        id="newBtn"
        type="button"
        onclick="newChat()"
      >
        ➕
      </button>

      <button
        id="clearBtn"
        type="button"
        onclick="clearChat()"
      >
        🗑️
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div id="chat"></div>


  <!-- BOTTOM -->

  <div class="bottom">

    <input
      type="text"
      id="msg"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button
      id="voiceBtn"
      type="button"
      onclick="startVoice()"
    >
      🎤
    </button>

    <button
      id="sendBtn"
      type="button"
      onclick="send()"
    >
      Send
    </button>

  </div>


</div>



<script>

/* =====================================================
   ZORA AI STUDIO
   CLEAN CHAT ENGINE
===================================================== */


/* =====================================================
   OPENROUTER
===================================================== */

const API_URL =
  "https://openrouter.ai/api/v1/chat/completions";


/*
   API key is NOT hardcoded.

   The first time you press Send,
   Zora will ask for your OpenRouter API key.

   The key is then saved in localStorage.
*/

let API_KEY =
  localStorage.getItem("zoraApiKey") || "";


/* =====================================================
   DATE
===================================================== */

function getCurrentDate(){

  return new Date().toLocaleDateString(
    "en-IN",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/* =====================================================
   LANGUAGE
===================================================== */

function getLanguageInstruction(){

  const language =
    localStorage.getItem("zoraLanguage") || "en";


  if(language === "hi"){

    return "Always reply in Hindi (हिन्दी).";

  }


  if(language === "hinglish"){

    return "Always reply in natural Hinglish using simple Roman Hindi mixed with English.";

  }


  return "Always reply in English.";

}


/* =====================================================
   SYSTEM MESSAGE
===================================================== */

function createSystemMessage(){

  const savedMemory =
    localStorage.getItem("zoraMemory") ||
    "No saved user memory yet.";


  return {

    role:"system",

    content:

`You are Zora AI Studio, a helpful, friendly and intelligent AI assistant.

Current date:
${getCurrentDate()}

${getLanguageInstruction()}

Always answer directly, clearly and helpfully.

User memory:
${savedMemory}`

  };

}


/* =====================================================
   MESSAGES
===================================================== */

let messages = [
  createSystemMessage()
];


/* =====================================================
   CHAT ELEMENT
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("msg");

const sendBtn =
  document.getElementById("sendBtn");


/* =====================================================
   LOAD SAVED CHAT
===================================================== */

const savedChat =
  localStorage.getItem("zoraChat");


if(savedChat){

  chat.innerHTML =
    savedChat;

}


/* =====================================================
   WELCOME MESSAGE
===================================================== */

if(!savedChat){

  chat.innerHTML = `

    <div class="bot">

      <b>Zora:</b><br>

      👋 Hello! I am Zora AI Studio.

      <br>

      Ask me anything.

    </div>

  `;

}


/* =====================================================
   ENTER KEY
===================================================== */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      send();

    }

  }
);


/* =====================================================
   GET API KEY
===================================================== */

function getApiKey(){

  if(API_KEY){

    return API_KEY;

  }


  const key =
    prompt(
      "Enter your OpenRouter API key:"
    );


  if(!key){

    return "";

  }


  API_KEY =
    key.trim();


  localStorage.setItem(
    "zoraApiKey",
    API_KEY
  );


  return API_KEY;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function send(){

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const key =
    getApiKey();


  if(!key){

    addBotMessage(
      "⚠️ OpenRouter API key is required. Please press Send again and enter your key."
    );

    return;

  }


  const time =
    new Date().toLocaleTimeString(
      "en-IN",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  /* USER MESSAGE */

  messages.push({

    role:"user",

    content:text

  });


  chat.innerHTML += `

    <div class="you">

      <b>You:</b><br>

      ${escapeHTML(text)}

      <br>

      <small>${time}</small>

    </div>

  `;


  input.value = "";


  chat.scrollTop =
    chat.scrollHeight;


  /* DISABLE SEND */

  sendBtn.disabled =
    true;

  sendBtn.innerText =
    "...";


  /* TYPING */

  const typingDiv =
    document.createElement("div");


  typingDiv.className =
    "bot";


  typingDiv.innerHTML =

    "<b>Zora:</b><br>⌛ Zora is typing...";


  chat.appendChild(
    typingDiv
  );


  chat.scrollTop =
    chat.scrollHeight;


  try{

    /* =========================================
       API REQUEST
    ========================================= */

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer " + key,

            "Content-Type":
              "application/json",

            "HTTP-Referer":
              window.location.href,

            "X-Title":
              "Zora AI Studio"

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:
                messages,

              stream:false

            })

        }
      );


    /* =========================================
       READ RESPONSE
    ========================================= */

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        "OpenRouter Error " +
        response.status +
        ": " +
        (
          data?.error?.message ||
          "Request failed."
        )

      );

    }


    const reply =
      data?.choices?.[0]?.message?.content;


    if(!reply){

      throw new Error(
        "No response received from AI."
      );

    }


    /* REMOVE TYPING */

    typingDiv.remove();


    /* BOT MESSAGE */

    const botDiv =
      document.createElement("div");


    botDiv.className =
      "bot";


    botDiv.innerHTML = `

      <b>Zora:</b><br>

      <span class="reply-text">

        ${escapeHTML(reply).replace(/\n/g,"<br>")}

      </span>

      <br>

      <small>${time}</small>

      <br>

      <button
        class="copy-btn"
        type="button"
        onclick="copyZoraReply(this)"
      >
        📋 Copy
      </button>

      <button
        class="regenerate-btn"
        type="button"
        onclick="regenerateLastReply(this)"
      >
        🔄 Regenerate
      </button>

    `;


    chat.appendChild(
      botDiv
    );


    /* SAVE ASSISTANT */

    messages.push({

      role:"assistant",

      content:reply

    });


    /* SAVE CHAT */

    saveChat();


    chat.scrollTop =
      chat.scrollHeight;


  }catch(error){

    console.error(
      "Zora Error:",
      error
    );


    typingDiv.remove();


    addBotMessage(

      "❌ " +
      error.message

    );

  }


  /* ENABLE SEND */

  sendBtn.disabled =
    false;

  sendBtn.innerText =
    "Send";


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   ADD BOT MESSAGE
===================================================== */

function addBotMessage(text){

  const div =
    document.createElement("div");


  div.className =
    "bot";


  div.innerHTML =

    "<b>Zora:</b><br>" +
    escapeHTML(text).replace(
      /\n/g,
      "<br>"
    );


  chat.appendChild(div);


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   SAVE CHAT
===================================================== */

function saveChat(){

  localStorage.setItem(
    "zoraChat",
    chat.innerHTML
  );

}


/* =====================================================
   COPY REPLY
===================================================== */

async function copyZoraReply(button){

  const botDiv =
    button.closest(".bot");


  if(!botDiv){

    return;

  }


  const reply =
    botDiv.querySelector(
      ".reply-text"
    );


  if(!reply){

    return;

  }


  const text =
    reply.innerText.trim();


  if(!text){

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );


    button.innerText =
      "✅ Copied!";


    setTimeout(
      function(){

        button.innerText =
          "📋 Copy";

      },
      1500
    );


  }catch(error){

    fallbackCopy(
      text,
      button
    );

  }

}


/* =====================================================
   FALLBACK COPY
===================================================== */

function fallbackCopy(
  text,
  button
){

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";


  textarea.style.left =
    "-9999px";


  document.body.appendChild(
    textarea
  );


  textarea.select();


  try{

    document.execCommand(
      "copy"
    );


    button.innerText =
      "✅ Copied!";


  }catch(error){

    button.innerText =
      "❌ Copy failed";

  }


  document.body.removeChild(
    textarea
  );


  setTimeout(
    function(){

      button.innerText =
        "📋 Copy";

    },
    1500
  );

}


/* =====================================================
   REGENERATE
===================================================== */

async function regenerateLastReply(button){

  let lastUserIndex =
    -1;


  for(
    let i = messages.length - 1;
    i >= 0;
    i--
  ){

    if(
      messages[i].role === "user"
    ){

      lastUserIndex =
        i;

      break;

    }

  }


  if(lastUserIndex === -1){

    return;

  }


  const key =
    getApiKey();


  if(!key){

    return;

  }


  const userMessage =
    messages[lastUserIndex].content;


  button.innerText =
    "⌛ Generating...";


  button.disabled =
    true;


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer " + key,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:[

                createSystemMessage(),

                {

                  role:"user",

                  content:userMessage

                }

              ],

              stream:false

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data?.error?.message ||
        "Regeneration failed."

      );

    }


    const newReply =
      data?.choices?.[0]?.message?.content;


    if(!newReply){

      throw new Error(
        "Empty response."
      );

    }


    const botDiv =
      button.closest(".bot");


    const replyText =
      botDiv.querySelector(
        ".reply-text"
      );


    if(replyText){

      replyText.innerHTML =
        escapeHTML(
          newReply
        ).replace(
          /\n/g,
          "<br>"
        );
