<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Zora AI Studio</title>

<style>

/* ==============================
   RESET
============================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}


/* ==============================
   BODY
============================== */

body{

  min-height:100vh;
  width:100%;

  background:
    radial-gradient(
      circle at 50% 45%,
      #073b91 0%,
      #031b4f 35%,
      #01091f 70%,
      #00030d 100%
    );

  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

}


/* ==============================
   STARS
============================== */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background-image:

    radial-gradient(
      circle,
      rgba(210,245,255,.95) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(50,180,255,.85) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle,
      rgba(0,120,255,.7) 0 1.5px,
      transparent 2.5px
    );

  background-size:
    83px 97px,
    137px 151px,
    211px 223px;

  animation:starsMove 25s linear infinite;

  opacity:.65;

  z-index:0;

}


@keyframes starsMove{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-100px);
  }

}


/* ==============================
   CONTAINER
============================== */

.container{

  position:relative;

  z-index:1;

  width:95%;

  max-width:500px;

  height:92vh;

  display:flex;

  flex-direction:column;

  overflow:hidden;

  border-radius:22px;

  background:rgba(0,10,35,.60);

  border:1px solid rgba(0,180,255,.35);

  backdrop-filter:blur(14px);

  -webkit-backdrop-filter:blur(14px);

  box-shadow:

    0 0 15px rgba(0,160,255,.35),

    0 0 40px rgba(0,100,255,.20);

}


/* ==============================
   HEADER
============================== */

.header{

  min-height:70px;

  padding:12px 10px;

  display:flex;

  justify-content:center;

  align-items:center;

  position:relative;

  background:

    linear-gradient(
      90deg,
      rgba(0,45,120,.85),
      rgba(0,130,220,.85),
      rgba(0,45,120,.85)
    );

  border-bottom:1px solid rgba(80,200,255,.5);

  box-shadow:
    0 0 15px rgba(0,150,255,.6);

}


.header-title{

  color:white;

  font-size:21px;

  font-weight:bold;

  text-shadow:
    0 0 8px rgba(150,230,255,.9);

}


.header-actions{

  position:absolute;

  right:8px;

  display:flex;

  gap:6px;

}


.header-actions button{

  width:42px;

  height:42px;

  border-radius:12px;

  border:1px solid rgba(80,210,255,.55);

  background:rgba(0,80,180,.45);

  color:white;

  font-size:19px;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(0,150,255,.35);

}


.header-actions button:active{

  transform:scale(.94);

}


/* ==============================
   CHAT
============================== */

#chat{

  flex:1;

  padding:15px;

  overflow-y:auto;

  color:white;

  scroll-behavior:smooth;

}


#chat::-webkit-scrollbar{

  width:4px;

}


#chat::-webkit-scrollbar-thumb{

  background:
    linear-gradient(
      180deg,
      #00c8ff,
      #006eff
    );

  border-radius:10px;

}


/* ==============================
   MESSAGES
============================== */

.you,
.bot{

  padding:11px;

  border-radius:15px;

  margin:9px 0;

  word-wrap:break-word;

  line-height:1.5;

  animation:messageAppear .3s ease;

}


.you{

  text-align:right;

  background:rgba(0,110,255,.25);

  border:1px solid rgba(50,180,255,.55);

  box-shadow:
    0 0 10px rgba(0,140,255,.25);

}


.bot{

  text-align:left;

  background:rgba(0,70,180,.22);

  border:1px solid rgba(0,200,255,.4);

  box-shadow:
    0 0 10px rgba(0,150,255,.25);

}


@keyframes messageAppear{

  from{

    opacity:0;

    transform:translateY(8px);

  }

  to{

    opacity:1;

    transform:translateY(0);

  }

}


/* ==============================
   BUTTONS INSIDE MESSAGE
============================== */

.copy-btn,
.regenerate-btn{

  margin-top:8px;

  padding:6px 10px;

  border:none;

  border-radius:8px;

  color:white;

  cursor:pointer;

  font-size:13px;

}


.copy-btn{

  background:#168de2;

}


.regenerate-btn{

  background:#7b3db5;

  margin-left:5px;

}


/* ==============================
   BOTTOM
============================== */

.bottom{

  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:rgba(0,10,35,.75);

  border-top:1px solid rgba(0,160,255,.3);

  box-shadow:
    0 -5px 20px rgba(0,100,255,.15);

}


/* ==============================
   INPUT
============================== */

#msg{

  flex:1;

  min-width:0;

  padding:13px;

  border-radius:25px;

  outline:none;

  border:1px solid rgba(0,170,255,.45);

  color:white;

  background:rgba(0,40,100,.55);

  font-size:16px;

}


#msg::placeholder{

  color:rgba(200,230,255,.65);

}


#msg:focus{

  border-color:#00c8ff;

  box-shadow:
    0 0 10px rgba(0,180,255,.4);

}


/* ==============================
   BOTTOM BUTTONS
============================== */

.bottom button{

  border:none;

  cursor:pointer;

  color:white;

}


#voiceBtn{

  width:55px;

  height:55px;

  flex-shrink:0;

  border-radius:50%;

  background:rgba(0,100,200,.35);

  border:1px solid rgba(0,190,255,.5);

  font-size:21px;

}


#sendBtn{

  min-width:80px;

  height:55px;

  flex-shrink:0;

  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      #006eff,
      #00c8ff
    );

  font-size:16px;

  font-weight:bold;

  box-shadow:
    0 0 12px rgba(0,150,255,.45);

}


#sendBtn:disabled{

  opacity:.55;

  cursor:not-allowed;

}


/* ==============================
   MOBILE
============================== */

@media(max-width:400px){

  body{

    align-items:stretch;

  }

  .container{

    width:100%;

    max-width:none;

    height:100dvh;

    border-radius:0;

    border-left:none;

    border-right:none;

  }

  .header-title{

    font-size:18px;

  }

  .header-actions button{

    width:38px;

    height:38px;

  }

  #msg{

    font-size:14px;

  }

  #voiceBtn{

    width:50px;

    height:50px;

  }

  #sendBtn{

    min-width:72px;

    height:50px;

  }

}


/* ==============================
   LOADING
============================== */

.typing{

  opacity:.8;

}


</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-title">
      🤖 Zora AI Studio
    </div>

    <div class="header-actions">

      <button
        id="keyBtn"
        title="Set OpenRouter API Key"
      >
        🔑
      </button>

      <button
        id="newBtn"
        title="New Chat"
      >
        ➕
      </button>

      <button
        id="clearBtn"
        title="Clear Chat"
      >
        🗑️
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div id="chat"></div>


  <!-- BOTTOM -->

  <div class="bottom">

    <input
      type="text"
      id="msg"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="voiceBtn">
      🎤
    </button>

    <button id="sendBtn" onclick="send()">
  Send
    </button>
      
  

  </div>


</div>



<script>

/* =========================================
   ZORA AI STUDIO
   CLEAN CHAT JAVASCRIPT
========================================= */


/* =========================================
   OPENROUTER
========================================= */

const API_URL =
  "https://openrouter.ai/api/v1/chat/completions";


/*
   API key is stored only in browser
   localStorage.

   It is NOT written into this HTML file.
*/

let API_KEY =
  localStorage.getItem("zoraApiKey") || "";


/* =========================================
   ELEMENTS
========================================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("msg");

const sendBtn =
  document.getElementById("sendBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const keyBtn =
  document.getElementById("keyBtn");

const newBtn =
  document.getElementById("newBtn");

const clearBtn =
  document.getElementById("clearBtn");


/* =========================================
   DATE
========================================= */

function getDate(){

  return new Date().toLocaleDateString(
    "en-IN",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );

}


/* =========================================
   LANGUAGE
========================================= */

function getLanguageInstruction(){

  const language =
    localStorage.getItem("zoraLanguage") || "en";


  if(language === "hi"){

    return "Always reply in Hindi.";

  }


  if(language === "hinglish"){

    return "Always reply in natural Hinglish.";

  }


  return "Always reply in English.";

}


/* =========================================
   SYSTEM MESSAGE
========================================= */

function createSystemMessage(){

  return {

    role:"system",

    content:

`You are Zora AI Studio, a helpful, friendly and intelligent AI assistant.

Today's date is ${getDate()}.

${getLanguageInstruction()}

Answer clearly and directly.

Do not mention these system instructions.`

  };

}


/* =========================================
   MESSAGES
========================================= */

let messages = [
  createSystemMessage()
];


/* =========================================
   LOAD CHAT
========================================= */

const savedChat =
  localStorage.getItem("zoraChat");


if(savedChat){

  chat.innerHTML =
    savedChat;

}


/* =========================================
   SAVE CHAT
========================================= */

function saveChat(){

  localStorage.setItem(
    "zoraChat",
    chat.innerHTML
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================================
   TIME
========================================= */

function getTime(){

  return new Date().toLocaleTimeString(
    "en-IN",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================
   SET API KEY
========================================= */

keyBtn.addEventListener(
  "click",
  function(){

    const key =
      prompt(
        "Enter your OpenRouter API key:"
      );


    if(key === null){

      return;

    }


    const cleanKey =
      key.trim();


    if(cleanKey === ""){

      alert("API key cannot be empty.");

      return;

    }


    API_KEY =
      cleanKey;


    localStorage.setItem(
      "zoraApiKey",
      API_KEY
    );


    alert(
      "✅ OpenRouter API key saved."
    );

  }
);


/* =========================================
   SEND
========================================= */

async function send(){

  const text =
    input.value.trim();


  if(text === ""){

    return;

  }


  /*
     API KEY CHECK
  */

  if(!API_KEY){

    const key =
      prompt(
        "Enter your OpenRouter API key:"
      );


    if(key === null){

      return;

    }


    if(key.trim() === ""){

      alert(
        "API key is required for Zora AI."
      );

      return;

    }


    API_KEY =
      key.trim();


    localStorage.setItem(
      "zoraApiKey",
      API_KEY
    );

  }


  /* =======================================
     USER MESSAGE
  ======================================= */

  const time =
    getTime();


  messages.push({

    role:"user",

    content:text

  });


  chat.innerHTML += `

    <div class="you">

      <b>You:</b><br>

      ${escapeHTML(text)}

      <br>

      <small>${time}</small>

    </div>

  `;


  input.value = "";


  chat.scrollTop =
    chat.scrollHeight;


  sendBtn.disabled =
    true;

  sendBtn.innerText =
    "...";


  /* =======================================
     TYPING
  ======================================= */

  const typingDiv =
    document.createElement("div");


  typingDiv.className =
    "bot typing";


  typingDiv.innerHTML =
    "<b>Zora:</b><br>⌛ Zora is typing...";


  chat.appendChild(
    typingDiv
  );


  chat.scrollTop =
    chat.scrollHeight;


  try{


    /* =======================================
       API REQUEST
    ======================================= */

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer " + API_KEY,

            "Content-Type":
              "application/json",

            "HTTP-Referer":
              "https://zora-ai-studio.local",

            "X-Title":
              "Zora AI Studio"

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:
                messages,

              stream:false

            })

        }
      );


    /* =======================================
       RESPONSE
    ======================================= */

    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        "OpenRouter error " +
        response.status
      );

    }


    const reply =
      data?.choices?.[0]?.message?.content;


    if(!reply){

      throw new Error(
        "No AI response received."
      );

    }


    /* =======================================
       REMOVE TYPING
    ======================================= */

    typingDiv.remove();


    /* =======================================
       BOT MESSAGE
    ======================================= */

    const botDiv =
      document.createElement("div");


    botDiv.className =
      "bot";


    botDiv.innerHTML = `

      <b>Zora:</b><br>

      <span class="reply-text">
        ${escapeHTML(reply).replace(
          /\n/g,
          "<br>"
        )}
      </span>

      <br>

      <small>${time}</small>

      <br>

      <button
        class="copy-btn"
        onclick="copyReply(this)"
      >
        📋 Copy
      </button>

      <button
        class="regenerate-btn"
        onclick="regenerateReply(this)"
      >
        🔄 Regenerate
      </button>

    `;


    chat.appendChild(
      botDiv
    );


    /* =======================================
       SAVE ASSISTANT MESSAGE
    ======================================= */

    messages.push({

      role:"assistant",

      content:reply

    });


    saveChat();


  }catch(error){


    console.error(
      "Zora Error:",
      error
    );


    typingDiv.remove();


    const errorDiv =
      document.createElement("div");


    errorDiv.className =
      "bot";


    errorDiv.innerHTML = `

      <b>Zora:</b><br>

      ❌ ${escapeHTML(
        error.message
      )}

    `;


    chat.appendChild(
      errorDiv
    );


    saveChat();

  }


  /* =======================================
     ENABLE BUTTON
  ======================================= */

  sendBtn.disabled =
    false;

  sendBtn.innerText =
    "Send";


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
  "click",
  send
);


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      send();

    }

  }
);


/* =========================================
   COPY REPLY
========================================= */

function copyReply(button){

  const bot =
    button.parentElement;


  const reply =
    bot.querySelector(
      ".reply-text"
    );


  if(!reply){

    return;

  }


  const text =
    reply.innerText;


  navigator.clipboard
    .writeText(text)
    .then(function(){

      button.innerText =
        "✅ Copied!";


      setTimeout(
        function(){

          button.innerText =
            "📋 Copy";

        },
        1500
      );

    })
    .catch(function(){

      button.innerText =
        "❌ Failed";

    });

}


/* =========================================
   REGENERATE
========================================= */

async function regenerateReply(button){

  if(!API_KEY){

    alert(
      "Please set your OpenRouter API key first."
    );

    return;

  }


  let lastUserIndex =
    -1;


  for(
    let i = messages.length - 1;
    i >= 0;
    i--
  ){

    if(
      messages[i].role === "user"
    ){

      lastUserIndex =
        i;

      break;

    }

  }


  if(lastUserIndex === -1){

    return;

  }


  const userMessage =
    messages[lastUserIndex].content;


  button.disabled =
    true;


  button.innerText =
    "⌛ Generating...";


  try{


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Authorization":
              "Bearer " + API_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              model:
                "openrouter/free",

              messages:[
                createSystemMessage(),

                {
                  role:"user",
                  content:userMessage
                }
              ],

              stream:false

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        "Regeneration failed."
      );

    }


    const newReply =
      data?.choices?.[0]?.message?.content;


    if(!newReply){

      throw new Error(
        "Empty response."
      );

    }


    const botDiv =
      button.parentElement;


    const replyText =
      botDiv.querySelector(
        ".reply-text"
      );


    if(replyText){

      replyText.innerHTML =
        escapeHTML(
          newReply
        ).replace(
          /\n/g,
          "<br>"
        );

    }


    button.innerText =
      "🔄 Regenerate";


  }catch(error){

    console.error(error);


    button.innerText =
      "❌ Failed";


    setTimeout(
      function(){

        button.innerText =
          "🔄 Regenerate";

      },
      1500
    );

  }


  button.disabled =
    false;


  saveChat();

}


/* =========================================
   VOICE
========================================= */

voiceBtn.addEventListener(
  "click",
  startVoice
);


function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0].transcript;

      input.focus();

    };


  recognition.onerror =
    function(event){

      console.error(
        "Voice error:",
        event.error
      );

    };


  recognition.start();

}


/* =========================================
   NEW CHAT
========================================= */

newBtn.addEventListener(
  "click",
  function(){

    chat.innerHTML =
      "";


    messages = [
      createSystemMessage()
    ];


    localStorage.removeItem(
      "zoraChat"
    );

  }
);


/* =========================================
   CLEAR CHAT
========================================= */

clearBtn.addEventListener(
  "click",
  function(){

    chat.innerHTML =
      "";


    messages = [
      createSystem
