body::before{

}

@keyframes starsMove{

.container{

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

}

#newBtn:hover{
  background:rgba(0,160,240,.75);

  box-shadow:
    0 0 14px rgba(0,200,255,.7);
}

/* CHAT */

#chat{
  flex:1;
  padding:15px;

  overflow-y:auto;

  color:white;

  background:rgba(0,5,25,.12);

  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);

  scroll-behavior:smooth;
}

.you{
  background:rgba(0,110,255,.25);

  border:1px solid rgba(50,180,255,.55);

  padding:10px;
  border-radius:14px;
  margin:8px 0;

  text-align:right;
  word-wrap:break-word;

  box-shadow:
  0 0 8px rgba(0,140,255,.3),
  0 0 18px rgba(0,100,255,.12);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.bot{
  background:rgba(0,70,180,.22);

  border:1px solid rgba(0,200,255,.4);

  padding:10px;
  border-radius:14px;
  margin:8px 0;

  text-align:left;
  word-wrap:break-word;

  box-shadow:
  0 0 8px rgba(0,150,255,.3),
  0 0 20px rgba(0,120,255,.12);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.copy-btn{
  margin-top:8px;
  padding:5px 10px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  cursor:pointer;
  font-size:13px;
}
.regenerate-btn{
  margin-top:8px;
  margin-left:5px;
  padding:5px 10px;
  border:none;
  border-radius:8px;
  background:#8e44ad;
  color:white;
  cursor:pointer;
  font-size:13px;
}

.regenerate-btn:hover{

}
.copy-btn:hover{

}

#msg{

.bottom button:hover{

.bottom button:hover{

}

#sendBtn{

#sendBtn{

@media(max-width:400px){

.bot{

<div class="container">

  <div class="header">

    <span>🤖 Zora AI Studio</span>

    <div class="header-actions">
      <button id="newBtn" onclick="newChat()">➕</button>

    </div>

  </div>

      type="text"
      id="msg"
      placeholder="Type a message..."

    >

    <button onclick="startVoice()">🎤</button>

    <button id="sendBtn" onclick="send()">Send</button>

  </div>

</div>


<script>


alert("Zora JavaScript Loaded!");

/* =========================================
   ZORA AI STUDIO
   OPENROUTER CONFIGURATION
========================================= */
  const API_URL =
"https://openrouter.ai/api/v1/chat/completions";


/* =========================================
   DATE
========================================= */

let now = new Date();

let currentDate =
now.toLocaleDateString("en-IN",{
  weekday:"long",
  year:"numeric",
  month:"long",
  day:"numeric"
});


/* =========================================
   MEMORY
========================================= */

let savedMemory =
localStorage.getItem("zoraMemory");

let memoryText =
savedMemory
? savedMemory
: "No saved user memory yet.";


/* =========================================
   SYSTEM MESSAGE
========================================= */

function createSystemMessage(){

  const selectedLanguage =
    localStorage.getItem("zoraLanguage") || "en";


  let languageInstruction = "";


  if(selectedLanguage === "hi"){

    languageInstruction =
      "Always reply in Hindi (हिन्दी).";

  }

  else if(selectedLanguage === "hinglish"){

    languageInstruction =
      "Always reply in natural Hinglish using simple Roman Hindi mixed with English.";

  }

  else{

    languageInstruction =
      "Always reply in English.";

  }


  return {

    role:"system",

    content:`You are Zora AI Studio, a helpful, friendly and intelligent AI assistant.

Current date and time is:
${currentDate}

${languageInstruction}

Always answer directly and clearly.

User memory:
${memoryText}`

  };

}

/* =========================================
   MESSAGES
========================================= */

let messages = [
  createSystemMessage()
];


/* =========================================
   LOAD SAVED CHAT
========================================= */

let savedChat =
localStorage.getItem("zoraChat");

if(savedChat){

  document.getElementById("chat").innerHTML =
    savedChat;

}


/* =========================================
   ENTER KEY
========================================= */

document
.getElementById("msg")
.addEventListener("keypress",function(event){

  if(event.key === "Enter"){

    event.preventDefault();

    send();

  }

});


/* =========================================
   SEND MESSAGE
========================================= */

async function send(){

  const input =
    document.getElementById("msg");

  const chat =
    document.getElementById("chat");

  const sendBtn =
    document.getElementById("sendBtn");

  const text =
    input.value.trim();


  if(text === "") return;


  const time =
    new Date().toLocaleTimeString("en-IN",{
      hour:"2-digit",
      minute:"2-digit"
    });


  /* USER MESSAGE */

  messages.push({
    role:"user",
    content:text
  });


  /* SAVE NAME TO MEMORY */

  if(text.toLowerCase().includes("my name is")){

    const parts =
      text.split(/my name is/i);

    if(parts.length > 1){

      const name =
        parts[1].trim();

      memoryText =
        "User name is " + name;

      localStorage.setItem(
        "zoraMemory",
        memoryText
      );

    }

  }


  /* SHOW USER MESSAGE */

  chat.innerHTML += `

    <div class="you">

      <b>You:</b><br>

      ${escapeHTML(text)}

      <br>

      <small>${time}</small>

    </div>

  `;


  chat.scrollTop =
    chat.scrollHeight;


  /* CLEAR INPUT */

  input.value = "";


  /* DISABLE SEND */

  sendBtn.disabled = true;

  sendBtn.innerText = "..." ;


  /* TYPING */

  let typingDiv =
    document.createElement("div");

  typingDiv.className =
    "bot";

  typingDiv.innerHTML =
    "<b>Zora:</b><br>⌛ Zora is typing...";

  chat.appendChild(typingDiv);

  chat.scrollTop =
    chat.scrollHeight;


  try{

    /* =========================================
       API REQUEST
    ========================================= */

    const response =
      await fetch(API_URL,{

        method:"POST",

        headers:{

          "Authorization":
            "Bearer " + API_KEY,

          "Content-Type":
            "application/json",

          "HTTP-Referer":
            "https://zora-ai-studio.local",

          "X-Title":
            "Zora AI Studio"

        },

        body:JSON.stringify({

          model: "openrouter/free",

          messages:
            messages,

          stream:true

        })

      });


    /* =========================================
       CHECK HTTP ERROR
    ========================================= */

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "OpenRouter Error " +
        response.status +
        ": " +
        errorText
      );

    }


    if(!response.body){

      throw new Error(
        "Streaming response body is empty."
      );

    }


    /* REMOVE TYPING */

    typingDiv.remove();


    /* BOT MESSAGE */

    let botDiv =
      document.createElement("div");

    botDiv.className =
      "bot";

  botDiv.innerHTML =
  "<b>Zora:</b><br>" +
  "<span class='reply-text'></span>";

    chat.appendChild(botDiv);


    /* STREAM READER */

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");


    let buffer = "";

    let fullReply = "";


    /* =========================================
       STREAM LOOP
    ========================================= */

    while(true){

      const {
        value,
        done
      } = await reader.read();


      if(done) break;


      buffer +=
        decoder.decode(
          value,
          {stream:true}
        );


      const lines =
        buffer.split("\n");


      /* KEEP INCOMPLETE LINE */

      buffer =
        lines.pop();


      for(
        let line of lines
      ){

        line =
          line.trim();


        if(
          !line.startsWith("data:")
        ){

          continue;

        }


        const data =
          line.substring(5).trim();


        if(
          data === "[DONE]"
        ){

          continue;

        }


        try{

          const json =
            JSON.parse(data);


const token =
  json?.choices?.[0]?.delta?.content;


          if(token){

            fullReply +=
              token;

botDiv.innerHTML =
  "<b>Zora:</b><br>" +
  "<span class='reply-text'>" +
  escapeHTML(fullReply).replace(/\n/g,"<br>") +
  "</span>" +
  "<br><small>" +
  time +
  "</small>";


            chat.scrollTop =
              chat.scrollHeight;

          }

        }catch(parseError){

          console.log(
            "Stream parse skipped:",
            data
          );

        }

      }

    }
if(fullReply.trim() !== ""){

  if(fullReply.trim() !== ""){

  botDiv.innerHTML +=
    "<br>" +
    "<button class='copy-btn' onclick='copyZoraReply(this)'>📋 Copy</button>" +
    "<button class='regenerate-btn' onclick='regenerateLastReply(this)'>🔄 Regenerate</button>";

}

}

    /* =========================================
       SAVE ASSISTANT MESSAGE
    ========================================= */

    if(fullReply.trim() !== ""){

      messages.push({

        role:"assistant",

        content:fullReply

      });

    }else{

      botDiv.innerHTML =
        "<b>Zora:</b><br>⚠️ No response received.";

    }


  }catch(error){

    /* REMOVE TYPING */

    typingDiv.remove();


    /* SHOW ERROR */

    let errorDiv =
      document.createElement("div");

    errorDiv.className =
      "bot";

    errorDiv.innerHTML =
      "<b>Zora:</b><br>❌ " +
      escapeHTML(error.message);


    chat.appendChild(errorDiv);


    console.error(
      "Zora Error:",
      error
    );

  }


  /* SAVE CHAT */

  localStorage.setItem(
    "zoraChat",
    chat.innerHTML
  );


  /* ENABLE SEND */

  sendBtn.disabled =
    false;

  sendBtn.innerText =
    "Send";


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(text){
  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

    const newReply =
      data.choices?.[0]?.message?.content;

    if(!newReply){
      throw new Error("Empty response");
    }

    const botDiv =
      button.parentElement;

    const replyText =
      botDiv.querySelector(".reply-text");

    if(replyText){

      replyText.innerHTML =
        escapeHTML(newReply)
          .replace(/\n/g,"<br>");

    }

    button.innerText = "🔄 Regenerate";

  }catch(error){

    console.error(error);

    button.innerText = "❌ Failed";

    setTimeout(function(){

      button.innerText = "🔄 Regenerate";

    },1500);

  }

}

function fallbackCopy(text, success, failure){

  const textarea = document.createElement("textarea");

  textarea.value = text;

  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";

  document.body.appendChild(textarea);

  textarea.focus();
  textarea.select();

  try{

    const result = document.execCommand("copy");

    document.body.removeChild(textarea);

    if(result){
      success();
    }else{
      failure();
    }

  }catch(error){

    document.body.removeChild(textarea);

    failure();

  }
}
function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onresult =
    function(event){

      document
      .getElementById("msg")
      .value =
        event.results[0][0].transcript;

    };


  recognition.onerror =
    function(event){

      alert(
        "Voice Error: " +
        event.error
      );

    };


  recognition.start();

}
