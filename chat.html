<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zora AI Studio</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  width:100%;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,140,255,.25) 0 1px, transparent 2px),
    radial-gradient(circle at 80% 30%, rgba(0,170,255,.35) 0 1.5px, transparent 2px),
    radial-gradient(circle at 40% 70%, rgba(0,120,255,.3) 0 1px, transparent 2px),
    radial-gradient(circle at 90% 80%, rgba(0,200,255,.3) 0 1px, transparent 2px),
    radial-gradient(circle at 10% 90%, rgba(80,150,255,.25) 0 1.5px, transparent 2px),
    radial-gradient(
      circle at center,
      #073b91 0%,
      #031b4f 35%,
      #01091f 65%,
      #00030d 100%
    );

  background-size:
    180px 180px,
    250px 250px,
    220px 220px,
    300px 300px,
    200px 200px,
    100% 100%;

  background-attachment:fixed;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

/* STAR FIELD */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background-image:
    radial-gradient(circle, rgba(210,245,255,.95) 0 1px, transparent 2px),
    radial-gradient(circle, rgba(50,180,255,.85) 0 1px, transparent 2px),
    radial-gradient(circle, rgba(0,120,255,.7) 0 1.5px, transparent 2.5px),
    radial-gradient(circle, rgba(120,210,255,.8) 0 2px, transparent 3px);

  background-size:
    83px 97px,
    137px 151px,
    211px 223px,
    307px 319px;

  animation:starsMove 22s linear infinite;
  opacity:.75;
  z-index:0;
}

@keyframes starsMove{
  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-100px);
  }
}

/* NEBULA */

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(0,100,255,.16),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(0,180,255,.12),
      transparent 35%
    ),
    radial-gradient(
      circle at 50% 50%,
      rgba(30,80,255,.08),
      transparent 50%
    );

  z-index:0;
}

/* MAIN CONTAINER */

.container{
  position:relative;
  z-index:1;

  width:95%;
  max-width:450px;
  height:90vh;

  background:rgba(0,10,30,.55);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(0,170,255,.25);
  border-radius:20px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  box-shadow:
    0 0 12px rgba(0,160,255,.35),
    0 0 35px rgba(0,100,255,.25),
    0 0 70px rgba(0,80,255,.12),
    inset 0 0 30px rgba(0,150,255,.08);
}

/* HEADER */

.header{
  background:linear-gradient(
    90deg,
    rgba(0,45,120,.72),
    rgba(0,130,220,.72),
    rgba(0,45,120,.72)
  );

  color:white;
  padding:18px;

  font-size:22px;
  font-weight:bold;

  display:flex;
  justify-content:center;
  align-items:center;

  position:relative;

  border-bottom:1px solid rgba(80,200,255,.5);

  box-shadow:
    0 0 12px rgba(0,150,255,.7),
    0 0 30px rgba(0,100,255,.35);

  text-shadow:
    0 0 8px rgba(150,230,255,.9);
}

.header-actions{
  position:absolute;
  right:10px;

  display:flex;
  gap:6px;
}

.header-actions button{
  padding:7px 9px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* CLEAR */

#clearBtn{
  background:rgba(0,80,180,.55);
  border:1px solid rgba(0,190,255,.5);

  box-shadow:
    0 0 8px rgba(0,150,255,.35);

  transition:.2s ease;
}

#clearBtn:hover{
  background:rgba(0,110,220,.75);

  box-shadow:
    0 0 14px rgba(0,190,255,.7);
}

/* NEW */

#newBtn{
  background:rgba(0,120,220,.55);
  border:1px solid rgba(80,210,255,.55);

  box-shadow:
    0 0 8px rgba(0,150,255,.35);

  transition:.2s ease;
}

#newBtn:hover{
  background:rgba(0,160,240,.75);

  box-shadow:
    0 0 14px rgba(0,200,255,.7);
}

/* CHAT */

#chat{
  flex:1;

  padding:15px;

  overflow-y:auto;

  color:white;

  background:rgba(0,5,25,.12);

  scroll-behavior:smooth;
}

/* USER */

.you{
  background:rgba(0,110,255,.25);

  border:1px solid rgba(50,180,255,.55);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:right;

  word-wrap:break-word;

  box-shadow:
    0 0 8px rgba(0,140,255,.3),
    0 0 18px rgba(0,100,255,.12);

  animation:messageAppear .35s ease-out;
}

/* BOT */

.bot{
  background:rgba(0,70,180,.22);

  border:1px solid rgba(0,200,255,.4);

  padding:10px;

  border-radius:14px;

  margin:8px 0;

  text-align:left;

  word-wrap:break-word;

  box-shadow:
    0 0 8px rgba(0,150,255,.3),
    0 0 20px rgba(0,120,255,.12);

  animation:messageAppear .35s ease-out;
}

@keyframes messageAppear{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* BUTTONS */

.copy-btn,
.regenerate-btn{
  margin-top:8px;

  padding:5px 10px;

  border:none;

  border-radius:8px;

  color:white;

  cursor:pointer;

  font-size:13px;
}

.copy-btn{
  background:#3498db;
}

.regenerate-btn{
  margin-left:5px;
  background:#8e44ad;
}

.copy-btn:hover,
.regenerate-btn:hover{
  opacity:.85;
}

/* BOTTOM */

.bottom{
  display:flex;

  align-items:center;

  gap:8px;

  padding:10px;

  background:rgba(0,10,35,.65);

  border-top:1px solid rgba(0,160,255,.3);

  box-shadow:
    0 -5px 20px rgba(0,100,255,.12);
}

/* INPUT */

#msg{
  flex:1;

  padding:12px;

  border:1px solid rgba(0,170,255,.4);

  border-radius:25px;

  outline:none;

  font-size:16px;

  color:white;

  background:rgba(0,40,100,.45);

  box-shadow:
    inset 0 0 10px rgba(0,120,255,.12);
}

#msg::placeholder{
  color:rgba(200,230,255,.65);
}

#msg:focus{
  border-color:rgba(0,200,255,.8);

  box-shadow:
    0 0 8px rgba(0,170,255,.45),
    0 0 18px rgba(0,100,255,.2),
    inset 0 0 10px rgba(0,120,255,.12);
}

/* SEND */

#sendBtn{
  min-width:65px;

  padding:12px 16px;

  border:1px solid rgba(80,200,255,.4);

  border-radius:25px;

  background:linear-gradient(
    135deg,
    #006eff,
    #00c8ff
  );

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(0,140,255,.45);
}

#sendBtn:hover{
  box-shadow:
    0 0 18px rgba(0,180,255,.7);

  transform:translateY(-1px);
}

#sendBtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* VOICE */

.voice-btn{
  padding:12px 14px;

  border-radius:25px;

  background:rgba(0,100,200,.35);

  border:1px solid rgba(0,190,255,.5);

  color:white;

  cursor:pointer;

  box-shadow:
    0 0 10px rgba(0,150,255,.45);
}

/* SCROLLBAR */

#chat::-webkit-scrollbar{
  width:4px;
}

#chat::-webkit-scrollbar-track{
  background:rgba(0,10,35,.15);
}

#chat::-webkit-scrollbar-thumb{
  background:linear-gradient(
    180deg,
    rgba(0,200,255,.8),
    rgba(0,80,255,.65)
  );

  border-radius:10px;
}

/* MOBILE */

@media(max-width:400px){

  body{
    min-height:100dvh;
    align-items:stretch;
  }

  .container{
    width:100%;
    max-width:none;
    height:100dvh;

    border-radius:0;
  }

  .header{
    font-size:18px;
    padding:15px;
  }

  #msg{
    font-size:14px;
  }

  .bottom{
    padding:8px;
  }

  #sendBtn{
    padding:10px 12px;
  }

  .voice-btn{
    padding:10px 12px;
  }

  #chat{
    padding:12px;
  }
}
</style>
</head>

        ➕
      </button>

      <button
        id="clearBtn"
        onclick="clearChat()">

      </button>

    </div>

  </div>

  <div id="chat"></div>

  <div class="bottom">

    <input
      type="text"
      id="msg"

      autocomplete="off"
    >

    <button

    <button

    </button>

  </div>

</div>
